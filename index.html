    // Footnotes support for Markdown footnotes [^1]
    document.addEventListener('DOMContentLoaded', function() {
        var entry = document.querySelector('.mod-post__entry');
        var footnotesContainer = document.querySelector('#post-footnotes');
        
        if (!entry) return;

        // Get the raw HTML content
        var content = entry.innerHTML;
        
        // Find footnote definitions - standard format [^1]: definition
        // Handle both markdown [^1]: and HTML encoded versions
        var footnoteDefs = {};
        
        // Try various patterns to find footnote definitions
        var patterns = [
            /\[\^([^\]]+)\]:\s*([\s\S]*?)(?=<br\s*[\/]?>|\n\s*\n|\n\s*<h2|\n\s*$|$)/gi,
            /<p>\[\^([^\]]+)\]:\s*([\s\S]*?)<\/p>/gi,
            /<p>\[\^([^\]]+)\]:\s*([\s\S]*?)(?=<br\s*[\/]?>|$)/gi,
            /\[\^([^\]]+)\]:\s*([\s\S]{1,300}?)(?=<\/p>|$)/gi
        ];
        
        patterns.forEach(function(defRegex) {
            var match;
            while ((match = defRegex.exec(content)) !== null) {
                var fnName = match[1];
                var fnContent = match[2]
                    .trim()
                    .replace(/<br\s*[\/]?>/gi, ' ')
                    .replace(/<[^>]+>/g, '')
                    .replace(/&nbsp;/g, ' ')
                    .replace(/\s+/g, ' ');
                if (fnContent && fnContent.length > 2) {
                    footnoteDefs[fnName] = fnContent;
                }
            }
        });
        
        // If no definitions found, try to find definitions at the end of content
        // by looking for footnote links that contain the definition content in href
        if (Object.keys(footnoteDefs).length === 0) {
            var footnoteLinks = content.match(/<a\s+href="([^"]+)"\s*>(\^?[a-zA-Z0-9\u4e00-\u9fa5]+)<\/a>/g) || [];
            footnoteLinks.forEach(function(link) {
                var hrefMatch = link.match(/<a\s+href="([^"]+)"\s*>(\^?[a-zA-Z0-9\u4e00-\u9fa5]+)<\/a>/);
                if (hrefMatch) {
                    try {
                        var decodedHref = decodeURIComponent(hrefMatch[1]);
                        var fnName = hrefMatch[2].replace(/^\^/, '');
                        if (decodedHref && decodedHref.length > 2 && !decodedHref.match(/^https?:\/\//)) {
                            footnoteDefs[fnName] = decodedHref;
                        }
                    } catch (e) {}
                }
            });
        }
        
        // Also extract footnote definitions from the content before removing them
        // This handles cases where definitions might be in a different format
        if (Object.keys(footnoteDefs).length > 0) {
            var definedFns = Object.keys(footnoteDefs);
            var additionalDefs = content.match(/\[\^([^\]]+)\]:\s*([^\n<]+)/g) || [];
            additionalDefs.forEach(function(def) {
                var match = def.match(/\[\^([^\]]+)\]:\s*([^\n<]+)/);
                if (match && !footnoteDefs[match[1]]) {
                    footnoteDefs[match[1]] = match[2].trim();
                }
            });
        }
        
        // Replace raw [^1] references with sup tags
        var footnoteRefRegex = /\[\^([^\]]+)\](?!\s*:)/g;
        content = content.replace(footnoteRefRegex, function(match, fnName) {
            if (footnoteDefs[fnName]) {
                return '<sup class="footnote-ref" id="fnref-' + fnName + '"><a href="#fn-' + fnName + '">[' + fnName + ']</a></sup>';
            }
            return match;
        });
        
        // Handle Gridea's special link format: <a href="encoded-url">^1</a> or <a href="encoded-url">^亮哥</a>
        // Also handle links where href is URL-encoded content (Gridea format)
        content = content.replace(/<a\s+href="([^"]+)"\s*>(\^?[a-zA-Z0-9\u4e00-\u9fa5]+)<\/a>/g, function(match, href, fnName) {
            fnName = fnName.replace(/^\^/, '');
            try {
                var decodedHref = decodeURIComponent(href);
                // Check if footnote definition exists OR if href contains footnote content (non-URL)
                if (footnoteDefs[fnName] || (decodedHref && decodedHref.length > 3 && !decodedHref.match(/^https?:\/\//))) {
                    return '<sup class="footnote-ref" id="fnref-' + fnName + '"><a href="#fn-' + fnName + '">[' + fnName + ']</a></sup>';
                }
            } catch (e) {}
            return match;
        });
        
        // Remove footnote definitions from content
        content = content.replace(/\[\^([^\]]+)\]:\s*[\s\S]*?(?=<br\s*[\/]?>|\n\s*\n|<h2|$)/gi, '');
        content = content.replace(/<p>\[\^[^\]]+\]:\s*[\s\S]*?<\/p>/gi, '');
        content = content.replace(/<p>\s*<\/p>/g, '');
        content = content.replace(/<p>\s*<br\s*[\/]?>\s*<\/p>/g, '');
        
        entry.innerHTML = content;
        
        // Create the footnotes section
        var fnKeys = Object.keys(footnoteDefs);
        if (fnKeys.length > 0 && footnotesContainer) {
            var footnotesSection = document.createElement('section');
            footnotesSection.className = 'footnotes';
            
            var heading = document.createElement('h4');
            heading.className = 'footnotes-title';
            heading.textContent = '参考资料';
            footnotesSection.appendChild(heading);
            
            var ol = document.createElement('ol');
            ol.className = 'footnotes-list';
            
            fnKeys.forEach(function(fnName) {
                var li = document.createElement('li');
                li.id = 'fn-' + fnName;
                li.innerHTML = '<span class="footnote-content">' + footnoteDefs[fnName] + '</span> <a href="#fnref-' + fnName + '" class="footnote-backref">↩</a>';
                ol.appendChild(li);
            });
            
            footnotesSection.appendChild(ol);
            footnotesContainer.appendChild(footnotesSection);
        }
    });

                            <div class="intro-quote" id="quote-container">
                                <p>" <span id="quote-text">他想，我的人生之路确实古怪曲折。少年时，我只知神明和献祭。青年时，我只知苦修、思考和禅定；我渴求梵天，崇拜永恒的阿特曼。壮年时，我追随忏悔者生活在林中，漠视肉体，忍受酷暑严寒和饥饿。之后我又奇迹般地与佛陀和他至高的法义相遇，关乎圆一世界的真理如血液般在我体内奔涌，但我又不得不告别佛陀及其伟大学说。</span> "</p>
                                <p class="intro-quote-author">—— <span id="quote-author">《悉达多》</span></p>
